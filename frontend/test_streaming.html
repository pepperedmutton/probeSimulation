<!DOCTYPE html>
<html>
<head>
    <title>Streaming Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #log { 
            border: 1px solid #ccc; 
            padding: 10px; 
            height: 400px; 
            overflow-y: scroll; 
            background: #f5f5f5;
        }
        .log-entry { margin: 2px 0; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Streaming API Test</h1>
    <button onclick="testStreaming()">Start Streaming Test</button>
    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        
        function log(message, className = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + className;
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function testStreaming() {
            logEl.innerHTML = '';
            log('Starting streaming test...', 'success');
            
            const payload = {
                plasma: {ne: 5e15, te_eV: 3.0, vs: 0.0, gas_type: "Ar"},
                probe: {area: 1e-6, radius: 1e-3, length: 5e-3, capacitance: 1e-12},
                rf: {frequency_hz: 13560000, te_amplitude_ev: 0.5, ne_amplitude: 1e14, vs_amplitude_v: 2.0},
                time_range: {total_time_s: 0.01, dt_s: 1e-8},
                vp_initial: -30.0,
                vp_final: 20.0,
                model: "ABR",
                integrator: "rk4"
            };
            
            try {
                log('Sending request to http://localhost:8000/api/iv/dynamic/stream');
                
                const response = await fetch('http://localhost:8000/api/iv/dynamic/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                log('Response received, starting to read stream...', 'success');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let chunkCount = 0;
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) {
                        log('Stream complete!', 'success');
                        break;
                    }
                    
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            chunkCount++;
                            const data = JSON.parse(line.slice(6));
                            const points = data.time ? data.time.length : 0;
                            const progress = data.progress ? (data.progress * 100).toFixed(1) : 'N/A';
                            log(`Chunk ${chunkCount}: ${points} points, progress=${progress}%`, 'success');
                        }
                    }
                }
                
                log(`Total chunks received: ${chunkCount}`, 'success');
                
            } catch (err) {
                log(`Error: ${err.message}`, 'error');
                console.error(err);
            }
        }
    </script>
</body>
</html>
