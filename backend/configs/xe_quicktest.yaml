plasma:
  gas: Xe
  neutral_pressure_pa: 0.5
  gas_temperature_k: 300.0
  ionization_fraction: 0.05
  electron_temperature_ev: 3.0
  ion_temperature_ev: 0.05
  plasma_potential_v: 15.0

domain:
  lx_m: 0.0064
  ly_m: 0.0010
  nx: 256
  ny: 80
  particles_per_species: 48000
  snapshot_interval: 10
  downsample: 2
  poisson_iterations: 60
  relaxation_steps: 20
  domain_depth: 0.002453125
  rng_seed: 11
  charge_smoothing_steps: 6
  charge_relaxation: 0.05
  window_fraction_x: [0.375, 0.625]
  window_fraction_y: [0.375, 0.625]
  periodic_x: true
  enforce_lateral_uniformity: true

probe:
  shape: rectangle
  center_x_m: 0.0032
  center_y_m: 0.00005
  width_m: 0.0064
  height_m: 0.0001

bias_scan:
  bias_values: [15.0]
  ramp_steps: 40
  settle_steps: 40
  measure_steps: 80

diagnostics:
  snapshot_dir: outputs/xe_quicktest
  summary_path: outputs/xe_quicktest/run_summary.txt
  snapshot_steps: [0, 40, 80, 120]
  downsample: 2
