plasma:
  gas: Xe
  neutral_pressure_pa: 0.02
  gas_temperature_k: 300.0
  plasma_density_m3: 2.0e19
  electron_temperature_ev: 4.0
  ion_temperature_ev: 0.05
  plasma_potential_v: 18.0

domain:
  lx_m: 0.0072
  ly_m: 0.0012
  nx: 288
  ny: 96
  particles_per_species: 60000
  snapshot_interval: 30
  downsample: 2
  poisson_iterations: 90
  relaxation_steps: 80
  domain_depth: 0.001
  rng_seed: 31
  charge_smoothing_steps: 10
  charge_relaxation: 0.05
  planar_symmetry: true
  planar_effective_area_m2: 1.57e-5
  window_fraction_x: [0.375, 0.625]

probe:
  shape: circle
  center_x_m: 0.0009
  center_y_m: 0.00022
  radius_m: 0.00007

bias_scan:
  bias_values: [18.0, 12.0, 6.0, 0.0, -6.0]
  ramp_steps: 60
  settle_steps: 80
  measure_steps: 160

diagnostics:
  snapshot_dir: outputs/xe_thin_dense
  summary_path: outputs/xe_thin_dense/run_summary.txt
  snapshot_steps: [60, 180, 360, 540]
  downsample: 2
