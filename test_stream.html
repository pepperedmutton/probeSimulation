<!DOCTYPE html>
<html>
<head>
    <title>Stream Test</title>
</head>
<body>
    <h1>Stream API Test</h1>
    <button onclick="testStream()">Start Stream Test</button>
    <div id="status"></div>
    <div id="log" style="max-height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-top: 20px;"></div>

    <script>
        async function testStream() {
            const statusEl = document.getElementById('status');
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            
            const payload = {
                plasma: {ne: 5e15, te_eV: 3.0, vs: 0.0, gas_type: "Ar"},
                probe: {area: 1e-6, radius: 1e-3, length: 5e-3, capacitance: 1e-12},
                rf: {frequency_hz: 13560000, te_amplitude_ev: 0.5, ne_amplitude: 1e14, vs_amplitude_v: 2.0},
                time_range: {total_time_s: 0.01, dt_s: 1e-8},
                vp_initial: -30.0,
                vp_final: 20.0,
                model: "ABR",
                integrator: "rk4"
            };
            
            statusEl.textContent = 'Starting stream...';
            
            try {
                const response = await fetch('http://localhost:8000/api/iv/dynamic/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let chunkCount = 0;
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            chunkCount++;
                            const data = JSON.parse(line.slice(6));
                            const msg = data.metadata ? 
                                `Chunk ${chunkCount}: Metadata received` :
                                `Chunk ${chunkCount}: ${data.time ? data.time.length : 0} points, Progress: ${Math.round((data.progress || 0) * 100)}%`;
                            logEl.innerHTML += `<div>${msg}</div>`;
                            logEl.scrollTop = logEl.scrollHeight;
                            statusEl.textContent = msg;
                        }
                    }
                }
                
                statusEl.textContent = `Stream complete! Received ${chunkCount} chunks`;
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                logEl.innerHTML += `<div style="color: red">Error: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
